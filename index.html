<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quest of Truth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        .screen { display: none; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; }
        .screen.active { display: flex; }
        #gameCanvas { display: block; background: #222; }
        .btn { border: 2px solid white; padding: 15px 30px; border-radius: 12px; margin: 10px; cursor: pointer; transition: 0.3s; }
        .btn:hover { background: white; color: black; }
    </style>
</head>
<body>

    <div id="screen-login" class="screen active">
        <h1 class="text-4xl font-bold text-yellow-400 mb-8">Quest of Truth</h1>
        <button class="btn" onclick="showScreen('screen-char')">เริ่มเล่นเกม</button>
    </div>

    <div id="screen-char" class="screen">
        <h2 class="text-2xl mb-6">เลือกสีตัวละคร</h2>
        <div class="grid grid-cols-2 gap-4">
            <button class="btn" onclick="startGame('red')">สีแดง</button>
            <button class="btn" onclick="startGame('green')">สีเขียว</button>
        </div>
    </div>

    <div id="screen-game" class="screen">
        <canvas id="gameCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let player = { x: 100, y: 100, color: 'red' };

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame(color) {
            showScreen('screen-game');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            player.color = color;
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', (e) => {
            const speed = 20;
            if (e.key === 'w' || e.key === 'W') player.y -= speed;
            if (e.key === 's' || e.key === 'S') player.y += speed;
            if (e.key === 'a' || e.key === 'A') player.x -= speed;
            if (e.key === 'd' || e.key === 'D') player.x += speed;
        });

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, 40, 40);
            requestAnimationFrame(loop);
        }
    </script>
</body>
</html>
